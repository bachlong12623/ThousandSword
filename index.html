<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vạn Kiếm Quy Tông · Tiên Kiếm Trận</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #020408;
      overflow: hidden;
    }

    #canvas {
      position: fixed;
      inset: 0;
    }

    #video {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 192px;
      height: 144px;
      opacity: 0.35;
      border: 1px solid rgba(180, 160, 90, 0.25);
      border-radius: 8px;
      transform: scaleX(-1);
      z-index: 10;
      box-shadow: 0 0 24px rgba(80, 140, 200, 0.15);
    }

    #ui {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }

    #status {
      color: #7a9ab8;
      font-size: 12px;
      letter-spacing: 2px;
      font-family: 'Noto Serif SC', serif;
      transition: opacity 1s;
    }

    #gesture-name {
      margin-top: 8px;
      font-size: 22px;
      font-weight: 700;
      font-family: 'Ma Shan Zheng', 'Noto Serif SC', serif;
      color: #f0e6c8;
      letter-spacing: 4px;
      text-shadow:
        0 0 8px rgba(255, 220, 140, 0.9),
        0 0 20px rgba(120, 200, 255, 0.5),
        0 0 40px rgba(80, 160, 255, 0.25);
      min-height: 36px;
    }

    #hint {
      position: fixed;
      bottom: 18px;
      left: 18px;
      color: rgba(120, 150, 180, 0.55);
      font-family: 'Noto Serif SC', serif;
      font-size: 11px;
      line-height: 2;
      z-index: 10;
      border-left: 2px solid rgba(180, 150, 80, 0.3);
      padding-left: 12px;
    }

    #hint strong {
      color: rgba(220, 200, 140, 0.75);
      font-weight: 400;
    }

    #skelCanvas {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 192px;
      height: 144px;
      z-index: 12;
      pointer-events: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="skelCanvas"></canvas>
  <div id="ui">
    <div id="status">Đang khởi động camera...</div>
    <div id="gesture-name"></div>
  </div>
  <div id="hint">
    ✊ Nắm tay &nbsp;→&nbsp; <strong>Vạn Kiếm Quy Tông</strong><br>
    🖐 Xòe tay &nbsp;→&nbsp; <strong>Bát Quái Tiên Trận</strong><br>
    ☞ Trỏ+giữa khép &nbsp;→&nbsp; <strong>Ngự Kiếm Thành Hình</strong><br>
    👍 Ngón cái &nbsp;→&nbsp; <strong>Ngũ Hành Đại Trận</strong><br>
    🤘 Sừng quỷ &nbsp;→&nbsp; <strong>Thái Cực Huyền Vortex</strong><br>
    🤟 Ba ngón &nbsp;→&nbsp; <strong>Tam Tài Tiên Kiếm</strong><br>
    🤙 Ngón út &nbsp;→&nbsp; <strong>Lăng Ba Vi Bộ</strong><br>
    ☝ Một ngón &nbsp;→&nbsp; <strong>Kiếm Khí Chỉ Pháp</strong>
  </div>

  <script type="module">
    import { HandLandmarker, FilesetResolver }
      from './assets/mediapipe/vision_bundle.mjs';

    'use strict';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const gestureEl = document.getElementById('gesture-name');
    const skelCanvas = document.getElementById('skelCanvas');
    const skelCtx = skelCanvas.getContext('2d');
    skelCanvas.width = 192;
    skelCanvas.height = 144;

    let CX, CY, SCALE;
    let bgStars = [];

    function initBgStars() {
      bgStars = [];
      const count = Math.floor((canvas.width * canvas.height) / 12000);
      for (let i = 0; i < count; i++) {
        bgStars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.4 + 0.3,
          phase: Math.random() * Math.PI * 2,
          spd: 0.001 + Math.random() * 0.003,
        });
      }
    }

    function updateLayout() {
      CX = canvas.width / 2;
      CY = canvas.height / 2;
      SCALE = Math.min(canvas.width, canvas.height) * 0.39;
    }
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      updateLayout();
      initBgStars();
    }
    resize();
    window.addEventListener('resize', resize);

    // ─── Gesture state ─────────────────────────────────────────────────────────
    let gestureSmooth = 'free';
    const gestureBuffer = [];
    let handLandmarks = null;
    let rawFingerTip = null;
    const fingerTrail = [];

    const GESTURE_LABELS = {
      free: '',
      fist: '萬劍歸宗 · VẠN KIẾM QUY TÔNG',
      open: '八卦仙陣 · BÁT QUÁI TIÊN TRẬN',
      sword: '御劍成型 · NGỰ KIẾM THÀNH HÌNH',
      thumb: '五行大陣 · NGŨ HÀNH ĐẠI TRẬN',
      rock: '太極漩渦 · THÁI CỰC HUYỀN VORTEX',
      three: '三才劍陣 · TAM TÀI TIÊN KIẾM',
      pinky: '凌波微步 · LĂNG BA VI BỘ',
      point: '劍氣一指 · KIẾM KHÍ CHỈ PHÁP',
    };

    const ELEMENT_PALETTES = {
      metal: { hue: 48, sat: 30, glow: 'rgba(255, 235, 180,', core: 'rgba(255, 252, 240,' },
      wood:  { hue: 128, sat: 75, glow: 'rgba(100, 255, 160,', core: 'rgba(220, 255, 230,' },
      water: { hue: 205, sat: 90, glow: 'rgba(80, 200, 255,', core: 'rgba(220, 245, 255,' },
      fire:  { hue: 12, sat: 95, glow: 'rgba(255, 120, 60,', core: 'rgba(255, 230, 200,' },
      earth: { hue: 35, sat: 55, glow: 'rgba(200, 160, 80,', core: 'rgba(255, 240, 210,' },
    };
    const ELEMENT_KEYS = ['metal', 'wood', 'water', 'fire', 'earth'];

    const GESTURE_AMBIENT = {
      fist:  [60, 140, 255],
      open:  [180, 220, 255],
      sword: [200, 230, 255],
      thumb: [255, 200, 80],
      rock:  [160, 100, 255],
      three: [100, 255, 180],
      pinky: [120, 210, 255],
      point: [255, 180, 80],
    };

    // ─── Shape clouds (tiên trận patterns) ─────────────────────────────────────
    function shuffle(pts) {
      for (let i = pts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pts[i], pts[j]] = [pts[j], pts[i]];
      }
      return pts;
    }

    function buildPolyCloud(n, verts) {
      const pts = [];
      const perSide = n / verts.length;
      for (let s = 0; s < verts.length; s++) {
        const from = verts[s], to = verts[(s + 1) % verts.length];
        for (let j = 0; j < perSide; j++) {
          const t = j / perSide;
          pts.push({
            x: from.x + (to.x - from.x) * t,
            y: from.y + (to.y - from.y) * t,
            seg: s,
          });
        }
      }
      while (pts.length < n) pts.push({ ...pts[pts.length - 1], seg: 0 });
      return pts.slice(0, n);
    }

    function buildSwordCloud(n) {
      const pts = [];
      const bladeCnt = Math.floor(n * 0.54);
      for (let i = 0; i < bladeCnt; i++) {
        const t = i / bladeCnt;
        const y = -0.42 + t * 0.38;
        const halfW = t * 0.044;
        pts.push({ x: (Math.random() * 2 - 1) * halfW, y, seg: 0 });
      }
      const guardCnt = Math.floor(n * 0.11);
      for (let i = 0; i < guardCnt; i++) {
        const t = i / guardCnt - 0.5;
        pts.push({ x: t * 0.22, y: -0.01 + (Math.random() - 0.5) * 0.04, seg: 1 });
      }
      const gripCnt = Math.floor(n * 0.28);
      for (let i = 0; i < gripCnt; i++) {
        const t = i / gripCnt;
        pts.push({ x: (Math.random() * 2 - 1) * 0.018, y: 0.02 + t * 0.24, seg: 2 });
      }
      const pommelCnt = n - bladeCnt - guardCnt - gripCnt;
      for (let i = 0; i < pommelCnt; i++) {
        const a = (i / pommelCnt) * Math.PI * 2;
        pts.push({ x: Math.cos(a) * 0.036, y: 0.28 + Math.sin(a) * 0.024, seg: 3 });
      }
      return shuffle(pts).slice(0, n);
    }

    // Bát Quái — octagon with inner talisman circle
    function buildBaguaCloud(n) {
      const pts = [];
      const outer = Math.floor(n * 0.72);
      const inner = n - outer;
      const R = 0.86;
      const perSide = outer / 8;
      for (let s = 0; s < 8; s++) {
        const a1 = s * Math.PI / 4 - Math.PI / 8;
        const a2 = (s + 1) * Math.PI / 4 - Math.PI / 8;
        for (let j = 0; j < perSide; j++) {
          const t = j / perSide;
          const a = a1 + (a2 - a1) * t;
          pts.push({ x: Math.cos(a) * R, y: Math.sin(a) * R, seg: s });
        }
      }
      for (let i = 0; i < inner; i++) {
        const a = (i / inner) * Math.PI * 2;
        const r = 0.22 + Math.sin(a * 4) * 0.04;
        pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, seg: 8 });
      }
      return pts;
    }

    // Ngũ Hành — pentagram star
    function buildWuxingCloud(n) {
      const R = 0.82, r = 0.30;
      const outer = i => ({
        x: Math.cos(i * Math.PI * 2 / 5 - Math.PI / 2) * R,
        y: Math.sin(i * Math.PI * 2 / 5 - Math.PI / 2) * R,
      });
      const inner = i => ({
        x: Math.cos((i + 0.5) * Math.PI * 2 / 5 - Math.PI / 2) * r,
        y: Math.sin((i + 0.5) * Math.PI * 2 / 5 - Math.PI / 2) * r,
      });
      const pts = [];
      const perEdge = n / 10;
      for (let e = 0; e < 10; e++) {
        const from = e % 2 === 0 ? outer(e >> 1) : inner(e >> 1);
        const to = e % 2 === 0 ? inner(e >> 1) : outer(((e >> 1) + 1) % 5);
        for (let j = 0; j < perEdge; j++) {
          const t = j / perEdge;
          pts.push({
            x: from.x + (to.x - from.x) * t,
            y: from.y + (to.y - from.y) * t,
            seg: Math.floor(e / 2),
          });
        }
      }
      while (pts.length < n) pts.push({ ...pts[pts.length - 1], seg: 0 });
      return pts.slice(0, n);
    }

    // Tam Tài — equilateral triangle + inner inverted (talisman seal)
    function buildSancaiCloud(n) {
      const outer = buildPolyCloud(Math.floor(n * 0.7), [
        { x: 0, y: -0.84 },
        { x: 0.73, y: 0.42 },
        { x: -0.73, y: 0.42 },
      ]);
      const innerN = n - outer.length;
      const inner = buildPolyCloud(innerN, [
        { x: 0, y: 0.38 },
        { x: -0.42, y: -0.22 },
        { x: 0.42, y: -0.22 },
      ]);
      return outer.concat(inner);
    }

    // Thái Cực — dual yin-yang spiral arms
    function buildTaijiCloud(n) {
      const pts = [];
      const half = Math.floor(n / 2);
      for (let i = 0; i < n; i++) {
        const t = (i % half) / half;
        const yang = i < half;
        const a = t * Math.PI * 6 + (yang ? 0 : Math.PI);
        const rv = 0.08 + t * 0.78;
        const wobble = Math.sin(t * Math.PI * 3) * 0.06;
        pts.push({
          x: Math.cos(a) * (rv + wobble) * (yang ? 1 : 0.92),
          y: Math.sin(a) * (rv + wobble) * (yang ? 1 : 0.92),
          seg: yang ? 0 : 1,
        });
      }
      return pts;
    }

    // Lăng Ba — flowing sine river (lightness steps on water)
    function buildLingboCloud(n) {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const t = i / n;
        const wx = (t * 2 - 1) * 0.90;
        const wy = Math.sin(t * Math.PI * 6) * 0.32 + Math.sin(t * Math.PI * 13) * 0.08;
        pts.push({ x: wx, y: wy, seg: Math.floor(t * 6) % 6 });
      }
      return pts;
    }

    const SWORD_CLOUD = buildSwordCloud(220);
    const BAGUA_CLOUD = buildBaguaCloud(220);
    const WUXING_CLOUD = buildWuxingCloud(220);
    const SANCAI_CLOUD = buildSancaiCloud(220);
    const TAIJI_CLOUD = buildTaijiCloud(220);
    const LINGBO_CLOUD = buildLingboCloud(220);

    // ─── Background stars / mist ───────────────────────────────────────────────
    function drawBackground(now) {
      const grd = ctx.createRadialGradient(CX, CY * 0.85, 0, CX, CY, SCALE * 2.2);
      grd.addColorStop(0, 'rgba(8, 16, 32, 0.55)');
      grd.addColorStop(0.45, 'rgba(4, 8, 18, 0.35)');
      grd.addColorStop(1, 'rgba(2, 4, 10, 0.2)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const s of bgStars) {
        const a = 0.15 + Math.sin(now * s.spd + s.phase) * 0.12;
        ctx.fillStyle = `rgba(200, 220, 255, ${a})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ─── Hand skeleton ─────────────────────────────────────────────────────────
    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [0, 9], [9, 10], [10, 11], [11, 12],
      [0, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [17, 18], [18, 19], [19, 20],
      [5, 9], [9, 13], [13, 17],
    ];

    function drawHandSkeleton(lm) {
      const W = skelCanvas.width, H = skelCanvas.height;
      skelCtx.clearRect(0, 0, W, H);
      if (!lm) return;

      const pt = i => ({ x: (1 - lm[i].x) * W, y: lm[i].y * H });

      skelCtx.save();
      skelCtx.lineCap = 'round';
      skelCtx.lineWidth = 1.2;
      skelCtx.shadowBlur = 8;
      skelCtx.shadowColor = 'rgba(180, 220, 255, 0.8)';
      skelCtx.strokeStyle = 'rgba(140, 200, 255, 0.7)';
      for (const [a, b] of HAND_CONNECTIONS) {
        const p1 = pt(a), p2 = pt(b);
        skelCtx.beginPath();
        skelCtx.moveTo(p1.x, p1.y);
        skelCtx.lineTo(p2.x, p2.y);
        skelCtx.stroke();
      }

      for (let i = 0; i < 21; i++) {
        const p = pt(i);
        const isTip = (i === 4 || i === 8 || i === 12 || i === 16 || i === 20);
        const rad = i === 0 ? 3 : isTip ? 2.8 : 1.6;
        skelCtx.fillStyle = isTip ? 'rgba(255, 250, 230, 0.95)' : 'rgba(120, 200, 255, 0.85)';
        skelCtx.shadowColor = 'rgba(200, 240, 255, 0.9)';
        skelCtx.shadowBlur = isTip ? 6 : 4;
        skelCtx.beginPath();
        skelCtx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        skelCtx.fill();
      }
      skelCtx.restore();
    }

    // ─── Jian (tiên kiếm) geometry ─────────────────────────────────────────────
    function ptAlong(cx, cy, cosA, sinA, nx, ny, dist, halfW) {
      const px = cx + cosA * dist;
      const py = cy + sinA * dist;
      return {
        l: { x: px + nx * halfW, y: py + ny * halfW },
        r: { x: px - nx * halfW, y: py - ny * halfW },
        c: { x: px, y: py },
      };
    }

    function bladeHalfWidth(L, t) {
      if (t > 0.9) return L * 0.003 * (1 - t) / 0.1;
      const flare = Math.min(t / 0.07, 1);
      const taper = Math.pow(1 - t, 0.72);
      return L * (0.028 * flare + 0.062 * taper);
    }

    function buildJianGeometry(cx, cy, angle, L) {
      const bladeLen = L * 0.76;
      const handleLen = L * 0.24;
      const cosA = Math.cos(angle), sinA = Math.sin(angle);
      const nx = -sinA, ny = cosA;

      const bladeL = [], bladeR = [];
      const SEG = 7;
      for (let i = 0; i <= SEG; i++) {
        const t = i / SEG;
        const p = ptAlong(cx, cy, cosA, sinA, nx, ny, t * bladeLen, bladeHalfWidth(L, t));
        bladeL.push(p.l);
        bladeR.push(p.r);
      }

      const hW = L * 0.016;
      const handleL = [], handleR = [];
      for (let i = 0; i <= 3; i++) {
        const t = i / 3;
        const p = ptAlong(cx, cy, cosA, sinA, nx, ny, -t * handleLen, hW * (1 - t * 0.3));
        handleL.push(p.l);
        handleR.push(p.r);
      }

      const guardW = L * 0.10;
      const guardD = L * 0.028;
      const guard = { x: cx, y: cy };
      const guardL = { x: cx + nx * guardW, y: cy + ny * guardW };
      const guardR = { x: cx - nx * guardW, y: cy - ny * guardW };
      const guardTipL = {
        x: cx + cosA * guardD + nx * guardW * 1.05,
        y: cy + sinA * guardD + ny * guardW * 1.05,
      };
      const guardTipR = {
        x: cx + cosA * guardD - nx * guardW * 1.05,
        y: cy + sinA * guardD - ny * guardW * 1.05,
      };
      const guardInnerL = {
        x: cx - cosA * guardD * 0.3 + nx * hW * 1.2,
        y: cy - sinA * guardD * 0.3 + ny * hW * 1.2,
      };
      const guardInnerR = {
        x: cx - cosA * guardD * 0.3 - nx * hW * 1.2,
        y: cy - sinA * guardD * 0.3 - ny * hW * 1.2,
      };

      const pommel = {
        x: cx - cosA * handleLen,
        y: cy - sinA * handleLen,
      };
      const tip = {
        x: cx + cosA * bladeLen,
        y: cy + sinA * bladeLen,
      };

      return {
        tip,
        guard, guardL, guardR, guardTipL, guardTipR, guardInnerL, guardInnerR,
        bladeL, bladeR, handleL, handleR, pommel,
        pommelR: L * 0.022,
      };
    }

    function traceBladePath(g) {
      ctx.moveTo(g.tip.x, g.tip.y);
      for (let i = g.bladeL.length - 2; i >= 0; i--) ctx.lineTo(g.bladeL[i].x, g.bladeL[i].y);
      ctx.lineTo(g.guardL.x, g.guardL.y);
      ctx.lineTo(g.guardInnerL.x, g.guardInnerL.y);
      ctx.lineTo(g.guardInnerR.x, g.guardInnerR.y);
      ctx.lineTo(g.guardR.x, g.guardR.y);
      for (let i = 0; i < g.bladeR.length; i++) ctx.lineTo(g.bladeR[i].x, g.bladeR[i].y);
      ctx.closePath();
    }

    // ─── Spirit particle (linh khí / kiếm quang) ───────────────────────────────
    const NUM = 220;
    const particles = [];

    function paletteForParticle(idx, gesture) {
      if (gesture === 'thumb') {
        return ELEMENT_PALETTES[ELEMENT_KEYS[idx % 5]];
      }
      if (gesture === 'rock') {
        return idx < NUM / 2
          ? { hue: 260, sat: 70, glow: 'rgba(140, 80, 255,', core: 'rgba(230, 210, 255,' }
          : { hue: 48, sat: 85, glow: 'rgba(255, 220, 120,', core: 'rgba(255, 248, 220,' };
      }
      const themes = {
        fist:  { hue: 200, sat: 90, glow: 'rgba(80, 180, 255,', core: 'rgba(220, 245, 255,' },
        open:  { hue: 195, sat: 60, glow: 'rgba(160, 210, 255,', core: 'rgba(240, 248, 255,' },
        sword: { hue: 210, sat: 40, glow: 'rgba(200, 230, 255,', core: 'rgba(255, 255, 255,' },
        three: { hue: 155, sat: 80, glow: 'rgba(80, 255, 180,', core: 'rgba(220, 255, 240,' },
        pinky: { hue: 190, sat: 75, glow: 'rgba(100, 220, 255,', core: 'rgba(220, 250, 255,' },
        point: { hue: 35, sat: 95, glow: 'rgba(255, 180, 80,', core: 'rgba(255, 240, 210,' },
        free:  { hue: 200 + (idx % 40), sat: 70, glow: 'rgba(100, 200, 255,', core: 'rgba(230, 245, 255,' },
      };
      const t = themes[gesture] || themes.free;
      const jitter = (idx * 17) % 25 - 12;
      return { ...t, hue: t.hue + jitter };
    }

    class Particle {
      constructor(idx) {
        this.idx = idx;
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 2.2;
        this.vy = (Math.random() - 0.5) * 2.2;
        this.angle = Math.random() * Math.PI * 2;
        this.vAngle = (Math.random() - 0.5) * 0.05;
        this.len = 32 + Math.random() * 38;
        this.alpha = 0.55 + Math.random() * 0.45;
        this.lerpK = (0.05 + Math.random() * 0.025) * 3.0;
        this.phase = Math.random() * Math.PI * 2;
        this.twinkle = 0.6 + Math.random() * 0.4;
        this.wisp = Math.random() < 0.18;
        this.wispR = 3 + Math.random() * 5;
        this.applyPalette('free');
        this._geom = null;
      }

      applyPalette(gesture) {
        const pal = paletteForParticle(this.idx, gesture);
        this.glowPrefix = pal.glow;
        this.corePrefix = pal.core;
        this.hue = pal.hue;
        this.sat = pal.sat;
      }

      update(now) {
        const g = gestureSmooth;
        if (g !== this._lastG) {
          this.applyPalette(g);
          this._lastG = g;
        }

        let tx, ty, ta;

        if (g === 'fist') {
          const RINGS = 5;
          const PER = NUM / RINGS;
          const ring = Math.floor(this.idx / PER);
          const pos = this.idx % PER;
          const speeds = [0.00015, -0.00022, 0.00028, -0.00018, 0.00012];
          const radii = [0.14, 0.30, 0.48, 0.66, 0.84];
          const a = (pos / PER) * Math.PI * 2 + now * speeds[ring];
          const rv = SCALE * radii[ring];
          const pulse = 1 + Math.sin(now * 0.002 + ring) * 0.04;
          tx = CX + Math.cos(a) * rv * pulse;
          ty = CY + Math.sin(a) * rv * pulse;
          ta = a + Math.PI;

        } else if (g === 'open') {
          const pt = BAGUA_CLOUD[this.idx];
          const next = BAGUA_CLOUD[(this.idx + 1) % NUM];
          const rot = now * 0.00012;
          const cosR = Math.cos(rot), sinR = Math.sin(rot);
          const px = pt.x * SCALE * 1.12, py = pt.y * SCALE * 1.12;
          tx = CX + px * cosR - py * sinR;
          ty = CY + px * sinR + py * cosR;
          if (pt.seg < 8) {
            ta = Math.atan2(next.y - pt.y, next.x - pt.x) + rot;
          } else {
            ta = (this.idx / NUM) * Math.PI * 2 + now * 0.0008;
          }

        } else if (g === 'sword') {
          const pt = SWORD_CLOUD[this.idx];
          const bob = Math.sin(now * 0.0015 + this.phase) * SCALE * 0.02;
          tx = CX + pt.x * SCALE * 1.55;
          ty = CY + pt.y * SCALE * 1.55 + bob;
          ta = -Math.PI * 0.5;

        } else if (g === 'thumb') {
          const pt = WUXING_CLOUD[this.idx];
          const next = WUXING_CLOUD[(this.idx + 1) % NUM];
          const rot = now * 0.0001;
          const cosR = Math.cos(rot), sinR = Math.sin(rot);
          const px = pt.x * SCALE * 1.14, py = pt.y * SCALE * 1.14;
          tx = CX + px * cosR - py * sinR;
          ty = CY + px * sinR + py * cosR;
          ta = Math.atan2(next.y - pt.y, next.x - pt.x) + rot;

        } else if (g === 'rock') {
          const pt = TAIJI_CLOUD[this.idx];
          const rot = now * 0.00018 * (pt.seg === 0 ? 1 : -1);
          const cosR = Math.cos(rot), sinR = Math.sin(rot);
          const px = pt.x * SCALE * 1.15, py = pt.y * SCALE * 1.15;
          tx = CX + px * cosR - py * sinR;
          ty = CY + px * sinR + py * cosR;
          const next = TAIJI_CLOUD[(this.idx + 3) % NUM];
          ta = Math.atan2(next.y - pt.y, next.x - pt.x) + rot;

        } else if (g === 'three') {
          const pt = SANCAI_CLOUD[this.idx];
          const next = SANCAI_CLOUD[(this.idx + 1) % NUM];
          const rot = now * 0.00008;
          const cosR = Math.cos(rot), sinR = Math.sin(rot);
          const px = pt.x * SCALE * 1.1, py = pt.y * SCALE * 1.1;
          tx = CX + px * cosR - py * sinR;
          ty = CY + px * sinR + py * cosR;
          ta = Math.atan2(next.y - pt.y, next.x - pt.x) + rot;

        } else if (g === 'pinky') {
          const pt = LINGBO_CLOUD[this.idx];
          const drift = now * 0.00025;
          const wx = pt.x + Math.sin(drift + this.phase) * 0.04;
          tx = CX + wx * SCALE * 1.18;
          ty = CY + pt.y * SCALE * 1.05;
          const next = LINGBO_CLOUD[(this.idx + 2) % NUM];
          ta = Math.atan2(next.y - pt.y, next.x - pt.x);

        } else if (g === 'point') {
          if (rawFingerTip) {
            const tgt = fingerTrail[this.idx] || fingerTrail[fingerTrail.length - 1];
            tx = tgt ? tgt.x : rawFingerTip.x;
            ty = tgt ? tgt.y : rawFingerTip.y;
            ta = this.idx < fingerTrail.length - 1
              ? Math.atan2(
                fingerTrail[this.idx].y - (fingerTrail[this.idx + 1]?.y ?? ty),
                fingerTrail[this.idx].x - (fingerTrail[this.idx + 1]?.x ?? tx))
              : this.angle;
          }
        }

        if (tx !== undefined) {
          this.x += (tx - this.x) * this.lerpK;
          this.y += (ty - this.y) * this.lerpK;
          if (g === 'fist' || g === 'point') {
            let da = ta - this.angle;
            if (da > Math.PI) da -= Math.PI * 2;
            if (da < -Math.PI) da += Math.PI * 2;
            this.angle += da * (g === 'point' ? 0.14 : 0.10);
          } else {
            let da = ta - this.angle;
            if (da > Math.PI) da -= Math.PI * 2;
            if (da < -Math.PI) da += Math.PI * 2;
            this.angle += da * 0.08;
          }
        } else {
          const drift = 0.3 + Math.sin(now * 0.0008 + this.phase) * 0.2;
          this.x += this.vx * drift;
          this.y += this.vy * drift;
          this.angle += this.vAngle;
          if (this.x < -60) this.vx = Math.abs(this.vx);
          if (this.x > canvas.width + 60) this.vx = -Math.abs(this.vx);
          if (this.y < -60) this.vy = Math.abs(this.vy);
          if (this.y > canvas.height + 60) this.vy = -Math.abs(this.vy);
        }

        this._geom = buildJianGeometry(this.x, this.y, this.angle, this.len);
      }

      draw(now, gesture) {
        const pulse = 0.82 + Math.sin(now * 0.004 + this.phase) * 0.18 * this.twinkle;
        const a = this.alpha * pulse;
        const isFree = gesture === 'free';

        if (this.wisp && (isFree || gesture === 'pinky')) {
          const wg = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.wispR * 3);
          wg.addColorStop(0, `${this.glowPrefix}${a * 0.3})`);
          wg.addColorStop(0.5, `${this.glowPrefix}${a * 0.1})`);
          wg.addColorStop(1, `${this.glowPrefix}0)`);
          ctx.fillStyle = wg;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.wispR * 2.5, 0, Math.PI * 2);
          ctx.fill();
          return;
        }

        const g = this._geom;
        if (!g) return;

        // Soft qi aura hugging the blade only (not a light-stick stroke)
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = `${this.glowPrefix}${a * 0.35})`;
        ctx.fillStyle = `${this.glowPrefix}${a * 0.08})`;
        ctx.beginPath();
        traceBladePath(g);
        ctx.fill();
        ctx.restore();

        // Handle (cán kiếm) — dark wrap
        const hGrd = ctx.createLinearGradient(g.pommel.x, g.pommel.y, g.guard.x, g.guard.y);
        hGrd.addColorStop(0, `rgba(35, 28, 22, ${a * 0.9})`);
        hGrd.addColorStop(0.5, `rgba(55, 42, 30, ${a * 0.95})`);
        hGrd.addColorStop(1, `rgba(70, 55, 38, ${a * 0.85})`);
        ctx.fillStyle = hGrd;
        ctx.beginPath();
        ctx.moveTo(g.handleL[0].x, g.handleL[0].y);
        for (let i = 1; i < g.handleL.length; i++) ctx.lineTo(g.handleL[i].x, g.handleL[i].y);
        for (let i = g.handleR.length - 1; i >= 0; i--) ctx.lineTo(g.handleR[i].x, g.handleR[i].y);
        ctx.closePath();
        ctx.fill();

        // Pommel disk
        ctx.fillStyle = `rgba(160, 140, 90, ${a * 0.85})`;
        ctx.beginPath();
        ctx.arc(g.pommel.x, g.pommel.y, g.pommelR, 0, Math.PI * 2);
        ctx.fill();

        // Guard (chấn thủ) — bronze wings
        const guardGrd = ctx.createLinearGradient(
          g.guardL.x, g.guardL.y, g.guardR.x, g.guardR.y);
        guardGrd.addColorStop(0, `rgba(140, 110, 60, ${a * 0.9})`);
        guardGrd.addColorStop(0.5, `rgba(220, 190, 110, ${a * 0.95})`);
        guardGrd.addColorStop(1, `rgba(140, 110, 60, ${a * 0.9})`);
        ctx.fillStyle = guardGrd;
        ctx.beginPath();
        ctx.moveTo(g.guardL.x, g.guardL.y);
        ctx.lineTo(g.guardTipL.x, g.guardTipL.y);
        ctx.lineTo(g.guardTipR.x, g.guardTipR.y);
        ctx.lineTo(g.guardR.x, g.guardR.y);
        ctx.lineTo(g.guardInnerR.x, g.guardInnerR.y);
        ctx.lineTo(g.guardInnerL.x, g.guardInnerL.y);
        ctx.closePath();
        ctx.fill();

        // Blade body — tapered jian with metallic edge darkening
        const bladeGrd = ctx.createLinearGradient(g.guard.x, g.guard.y, g.tip.x, g.tip.y);
        bladeGrd.addColorStop(0, `rgba(170, 195, 220, ${a * 0.75})`);
        bladeGrd.addColorStop(0.35, `rgba(220, 235, 250, ${a * 0.92})`);
        bladeGrd.addColorStop(0.75, `rgba(240, 248, 255, ${a * 0.96})`);
        bladeGrd.addColorStop(1, `rgba(255, 255, 255, ${a})`);
        ctx.fillStyle = bladeGrd;
        ctx.beginPath();
        traceBladePath(g);
        ctx.fill();

        // Edge highlights (sắc kiếm)
        ctx.strokeStyle = `rgba(60, 90, 130, ${a * 0.55})`;
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(g.bladeL[0].x, g.bladeL[0].y);
        for (let i = 1; i < g.bladeL.length; i++) ctx.lineTo(g.bladeL[i].x, g.bladeL[i].y);
        ctx.stroke();
        ctx.strokeStyle = `rgba(200, 225, 255, ${a * 0.7})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(g.bladeR[0].x, g.bladeR[0].y);
        for (let i = 1; i < g.bladeR.length; i++) ctx.lineTo(g.bladeR[i].x, g.bladeR[i].y);
        ctx.stroke();

        // Fuller groove (rãnh khắc)
        ctx.strokeStyle = `rgba(80, 120, 170, ${a * 0.35})`;
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(g.guard.x, g.guard.y);
        ctx.lineTo(g.tip.x, g.tip.y);
        ctx.stroke();

        // Subtle qi gleam on one edge
        const gleamT = 0.55 + Math.sin(now * 0.003 + this.phase) * 0.12;
        const gi = Math.min(g.bladeL.length - 2, Math.floor(gleamT * (g.bladeL.length - 1)));
        const gp = g.bladeL[gi];
        const gp2 = g.bladeL[gi + 1];
        ctx.strokeStyle = `rgba(255, 255, 255, ${a * 0.45})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(gp.x, gp.y);
        ctx.lineTo(gp2.x, gp2.y);
        ctx.stroke();

        // Tip gleam — small, not a glow orb
        const tipA = a * (0.5 + Math.sin(now * 0.007 + this.phase) * 0.3);
        ctx.fillStyle = `rgba(255, 255, 255, ${tipA})`;
        ctx.beginPath();
        ctx.moveTo(g.tip.x, g.tip.y);
        ctx.lineTo(g.bladeL[g.bladeL.length - 1].x, g.bladeL[g.bladeL.length - 1].y);
        ctx.lineTo(g.bladeR[g.bladeR.length - 1].x, g.bladeR[g.bladeR.length - 1].y);
        ctx.closePath();
        ctx.fill();
      }
    }

    for (let i = 0; i < NUM; i++) particles.push(new Particle(i));

    // ─── Formation overlays (bagua ring, taiji hint) ───────────────────────────
    function drawFormationOverlay(now, gesture) {
      ctx.save();
      ctx.globalAlpha = 0.12 + Math.sin(now * 0.002) * 0.04;

      if (gesture === 'open') {
        const rot = now * 0.00012;
        ctx.strokeStyle = 'rgba(180, 220, 255, 0.5)';
        ctx.lineWidth = 1;
        ctx.setLineDash([8, 12]);
        ctx.beginPath();
        ctx.arc(CX, CY, SCALE * 0.22, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4 + rot;
          ctx.beginPath();
          ctx.moveTo(CX + Math.cos(a) * SCALE * 0.25, CY + Math.sin(a) * SCALE * 0.25);
          ctx.lineTo(CX + Math.cos(a) * SCALE * 0.95, CY + Math.sin(a) * SCALE * 0.95);
          ctx.strokeStyle = `rgba(140, 200, 255, ${0.15 + (i % 2) * 0.1})`;
          ctx.stroke();
        }
      }

      if (gesture === 'rock') {
        const rot = now * 0.00015;
        ctx.beginPath();
        ctx.arc(CX, CY, SCALE * 0.88, rot, rot + Math.PI);
        ctx.strokeStyle = 'rgba(160, 100, 255, 0.25)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(CX, CY, SCALE * 0.88, rot + Math.PI, rot + Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 220, 120, 0.25)';
        ctx.stroke();
      }

      if (gesture === 'fist') {
        for (let r = 1; r <= 5; r++) {
          const rad = SCALE * (0.14 + r * 0.14);
          ctx.beginPath();
          ctx.arc(CX, CY, rad, now * 0.0001 * (r % 2 ? -1 : 1), now * 0.0001 * (r % 2 ? -1 : 1) + Math.PI * 1.5);
          ctx.strokeStyle = `rgba(80, 160, 255, ${0.08 + r * 0.02})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // ─── Render loop ───────────────────────────────────────────────────────────
    function frame(now) {
      ctx.fillStyle = 'rgba(2, 4, 12, 0.22)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawBackground(now);

      const g = gestureSmooth;

      if (g !== 'free') {
        const [rr, gg, bb] = GESTURE_AMBIENT[g] || [100, 180, 255];
        const ar = SCALE * (0.5 + Math.sin(now * 0.002) * 0.08);
        const grd = ctx.createRadialGradient(CX, CY, 0, CX, CY, ar);
        grd.addColorStop(0, `rgba(${rr},${gg},${bb},0.09)`);
        grd.addColorStop(0.6, `rgba(${rr},${gg},${bb},0.03)`);
        grd.addColorStop(1, 'transparent');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      drawFormationOverlay(now, g);

      if (g === 'point' && rawFingerTip) {
        const fg = ctx.createRadialGradient(
          rawFingerTip.x, rawFingerTip.y, 0,
          rawFingerTip.x, rawFingerTip.y, 72);
        fg.addColorStop(0, 'rgba(255, 240, 200, 0.45)');
        fg.addColorStop(0.3, 'rgba(255, 180, 80, 0.18)');
        fg.addColorStop(1, 'transparent');
        ctx.fillStyle = fg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (g === 'point' && rawFingerTip) {
        const last = fingerTrail[0];
        if (!last || Math.hypot(rawFingerTip.x - last.x, rawFingerTip.y - last.y) > 2) {
          fingerTrail.unshift({ x: rawFingerTip.x, y: rawFingerTip.y });
          if (fingerTrail.length > NUM) fingerTrail.length = NUM;
        }
      } else if (g !== 'point') {
        fingerTrail.length = 0;
      }

      for (const p of particles) p.update(now);

      for (const p of particles) p.draw(now, g);

      drawHandSkeleton(handLandmarks);

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ─── Gesture classifier ───────────────────────────────────────────────────
    function classifyGesture(lm) {
      const up = (tip, pip) => lm[tip].y < lm[pip].y - 0.01;
      const ix = up(8, 6);
      const mx = up(12, 10);
      const rx = up(16, 14);
      const px = up(20, 18);
      const upCount = [ix, mx, rx, px].filter(Boolean).length;

      if (upCount >= 4) return 'open';

      if (!ix && !mx && !rx && !px) {
        if (lm[4].y < lm[9].y - 0.07) return 'thumb';
        return 'fist';
      }

      if (ix && !mx && !rx && px) return 'rock';
      if (ix && !mx && !rx && !px) return 'point';
      if (ix && mx && rx && !px) return 'three';
      if (!ix && !mx && !rx && px) return 'pinky';

      if (ix && mx && !rx && !px) {
        const dist = Math.hypot(lm[8].x - lm[12].x, lm[8].y - lm[12].y);
        if (dist < 0.10) return 'sword';
      }

      return 'free';
    }

    function pushGesture(g) {
      gestureBuffer.push(g);
      if (gestureBuffer.length > 9) gestureBuffer.shift();
      const tally = {};
      for (const x of gestureBuffer) tally[x] = (tally[x] || 0) + 1;
      return Object.entries(tally).sort((a, b) => b[1] - a[1])[0][0];
    }

    // ─── MediaPipe HandLandmarker ───────────────────────────────────────────────
    async function initHandTracking() {
      statusEl.textContent = '⏳ Đang tụ linh khí · tải mô hình nhận diện tay...';

      const vision = await FilesetResolver.forVisionTasks('./assets/mediapipe/wasm');

      const handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: './assets/model/hand_landmarker.task',
          delegate: 'GPU',
        },
        runningMode: 'VIDEO',
        numHands: 1,
        minHandDetectionConfidence: 0.55,
        minHandPresenceConfidence: 0.55,
        minTrackingConfidence: 0.5,
      });

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 320, height: 240, facingMode: 'user' },
      });
      video.srcObject = stream;
      await video.play();

      statusEl.textContent = '📷 Tiên trận sẵn sàng — hướng tay vào màn hình';
      setTimeout(() => { statusEl.style.opacity = '0'; }, 3500);

      let lastVideoTime = -1;
      let detecting = false;

      async function detect() {
        if (!detecting && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
          detecting = true;
          lastVideoTime = video.currentTime;
          try {
            const result = handLandmarker.detectForVideo(video, performance.now());
            if (result.landmarks?.length) {
              handLandmarks = result.landmarks[0];
              rawFingerTip = {
                x: (1 - handLandmarks[8].x) * canvas.width,
                y: handLandmarks[8].y * canvas.height,
              };
              gestureSmooth = pushGesture(classifyGesture(handLandmarks));
            } else {
              handLandmarks = null;
              rawFingerTip = null;
              gestureSmooth = pushGesture('free');
            }
            gestureEl.textContent = GESTURE_LABELS[gestureSmooth] ?? '';
          } finally {
            detecting = false;
          }
        }
        setTimeout(detect, 80);
      }
      detect();
    }

    initHandTracking().catch(err => {
      statusEl.textContent = '⚠ Lỗi: ' + err.message;
      console.error(err);
    });
  </script>
</body>
